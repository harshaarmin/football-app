services:
  backend:
    build: ./backend
    image: annihilator29/football-backend:latest
    container_name: football-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    expose:
      - "3000"

    depends_on:
      redis:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    image: annihilator29/football-frontend:latest
    container_name: football-frontend
    restart: unless-stopped

    expose:
      - "80"

  redis:
    image: redis:7-alpine
    container_name: football-redis
    restart: unless-stopped

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: football-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    ports:
      - "9090:9090"

    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: football-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    depends_on:
      - prometheus

    volumes:
      - grafana-storage:/var/lib/grafana

  nginx:
    build: ./nginx
    image: annihilator29/football-nginx:latest
    container_name: football-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  grafana-storage: